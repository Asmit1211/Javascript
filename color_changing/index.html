<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Color Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1 id="colorBtn">Random Color Generator</h1>

        <p>
            Background changes every <strong>1 second</strong>
        </p>

        <div class="buttons">
            <button id="bgBtn">Start Changing</button>
            <button id="stopBtn">Stop</button>
        </div>

        <div class="color-display">
            Current Color:
            <span id="colorCode">#ffffff</span>
        </div>

    </div>

    <script src="index.js"></script>

</body>

</html>
